<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081324" />
      <stop offset="50%" stop-color="#0e1f3d" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>
    <linearGradient id="plateTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="plateMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="plateBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Ambient diffuse glow -->
  <circle cx="32" cy="30" r="20" fill="#38bdf8" fill-opacity="0.16" filter="url(#coreGlow)" />

  <!-- Layer 3 (Bottom Cadastral Plate) -->
  <path d="M32 49 L15 39 L32 29 L49 39 Z" fill="url(#plateBot)" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Layer 2 (Middle Transaction Escrow Plate) -->
  <path d="M32 40 L15 30 L32 20 L49 30 Z" fill="url(#plateMid)" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.75" />

  <!-- Layer 1 (Top Sovereign Sealed Plate) -->
  <path d="M32 31 L15 21 L32 11 L49 21 Z" fill="url(#plateTop)" stroke="#ffffff" stroke-width="1.6" />

  <!-- Central Luminous Cadastral Ledger Node -->
  <circle cx="32" cy="21" r="3" fill="#ffffff" filter="url(#coreGlow)" />
  <circle cx="32" cy="21" r="5.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />
</svg>
